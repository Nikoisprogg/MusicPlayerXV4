<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARJSevenX Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* Import font dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        /* Reset dan Pengaturan Dasar Body */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #121212;
            color: #fff;
        }

        /* Kontainer utama music player */
        .music-player {
            position: relative; /* Pastikan ini ada agar .player-icon bisa diposisikan relatif terhadapnya */
            width: 350px;
            background: #1e1e1e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* --- CSS BARU UNTUK ICON PEMAIN DI POJOK KANAN ATAS --- */
        .player-icon {
            position: absolute;
            top: 15px;      /* Jarak dari atas */
            right: 15px;    /* Jarak dari kanan */
            width: 40px;    /* Ukuran bulat */
            height: 40px;
            border-radius: 50%; /* Membuatnya bulat */
            overflow: hidden;
            box-shadow: 0 0 8px #00aaff, 0 0 15px rgba(0, 170, 255, 0.7); /* Efek bercahaya */
            transition: box-shadow 0.3s ease-in-out;
            cursor: pointer; /* Menandakan bisa diklik (jika ingin ditambahkan fungsionalitas) */
        }

        .player-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%; /* Pastikan gambar di dalamnya juga bulat */
        }

        /* Efek cahaya lebih kuat saat di-hover (opsional) */
        .player-icon:hover {
            box-shadow: 0 0 10px #00aaff, 0 0 20px rgba(0, 170, 255, 1);
        }
        /* --- AKHIR CSS BARU --- */

        /* Judul player "arjsevenx" */
        .player-title {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #00aaff;
            text-shadow: 0 0 5px #00aaff, 0 0 10px rgba(0, 170, 255, 0.5);
        }

        /* Info lagu */
        .song-info {
            text-align: center;
        }

        .album-cover {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease-in-out;
        }

        .album-cover img.loading {
            opacity: 0;
        }
        
        /* CSS untuk spinner loading */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #00aaff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1s linear infinite;
            display: none;
            z-index: 10;
        }

        .loader.visible {
            display: block;
        }

        @keyframes spin {
            to { 
                transform: translate(-50%, -50%) rotate(360deg); 
            }
        }

        .song-info h2 {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.7);
        }

        .song-info p {
            font-size: 1em;
            color: #aaa;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #444;
            border-radius: 3px;
            margin: 25px 0;
            cursor: pointer;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00aaff;
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        
        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #aaa;
            margin-top: -20px;
            margin-bottom: 20px;
        }

        /* Tombol kontrol */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        #play-pause-btn {
            background: #00aaff;
            color: #fff;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #play-pause-btn:hover {
            background: #0088cc;
        }

        #play-pause-btn:active {
            transform: scale(0.95);
        }

        /* Playlist */
        .playlist {
            margin-top: 20px;
        }

        .playlist h3 {
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .playlist ul {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .playlist li {
            padding: 12px 5px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist li.active,
        .playlist li:hover {
            background: #2a2a2a;
        }

        .playlist li:last-child {
            border-bottom: none;
        }

        .playlist .song-title {
            font-weight: 600;
        }

        .playlist .artist-name {
            font-size: 0.9em;
            color: #888;
        }

        .playlist ul::-webkit-scrollbar {
            width: 5px;
        }

        .playlist ul::-webkit-scrollbar-thumb {
            background: #00aaff;
            border-radius: 5px;
        }

        .playlist ul::-webkit-scrollbar-track {
            background: #333;
        }
    </style>
</head>
<body>

    <div class="music-player">
        <h1 class="player-title">🔰ARJSevenX</h1>

        <div class="player-icon">
            <img src="https://files.catbox.moe/y7x7xg.jpg" alt="Player Icon" id="https://files.catbox.moe/y7x7xg.jpg">
        </div>
        <div class="song-info">
            <div class="album-cover">
                <img src="https://files.catbox.moe/ta4vrj.jpg" alt="Album Cover" id="current-cover">
                <div class="loader" id="loader"></div>
            </div>
            <h2 id="current-song-title">Judul Lagu</h2>
            <p id="current-artist">Nama Artis</p>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-stamps">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
        </div>
        
        <div class="controls">
            <button id="play-pause-btn">
                <i class="fas fa-play" id="play-pause-icon"></i>
            </button>
        </div>

        <div class="playlist">
            <h3>Daftar Putar</h3>
            <ul id="playlist-ul">
            
                <li data-src="https://files.catbox.moe/m4rby9.mp3" data-cover="https://files.catbox.moe/ta4vrj.jpg">
                    <span class="song-title">Bohemian Rhapsody</span>
                    <span class="artist-name">Queen</span>
                </li>
                
                <li data-src="https://files.catbox.moe/e4qby7.mp3" data-cover="https://files.catbox.moe/p3gc82.png">
    <span class="song-title">'39</span>
    <span class="artist-name">Queen</span>
</li>

                <li data-src="https://files.catbox.moe/jeinjy.mp3" data-cover="https://files.catbox.moe/g55f19.jpeg">
                    <span class="song-title">Tabola Bale</span>
                    <span class="artist-name">Silet Open Up, Jacson Zeran, Juan Reza, dan Kiki Aco</span>
                </li>
                
                <li data-src="https://files.catbox.moe/2a33fy.mp3" data-cover="https://files.catbox.moe/d1cr8q.jpeg">
    <span class="song-title">Washing Machine Heart</span>
    <span class="artist-name">Mitski</span>
</li>

                
                <li data-src="https://files.catbox.moe/1chmuk.mp3" data-cover="https://files.catbox.moe/3w84la.jpg">
                    <span class="song-title">Radio GaGa</span>
                    <span class="artist-name">Queen</span>
                </li>
            </ul>
        </div>
    </div>

    <audio id="audio-player" preload="metadata"></audio>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audioPlayer = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playPauseIcon = document.getElementById('play-pause-icon');
            const progressBar = document.getElementById('progress-bar');
            const progressContainer = document.getElementById('progress-container');
            const currentTimeEl = document.getElementById('current-time');
            const totalDurationEl = document.getElementById('total-duration');
            const coverImage = document.getElementById('current-cover');
            const songTitleEl = document.getElementById('current-song-title');
            const artistEl = document.getElementById('current-artist');
            const playlistItems = document.querySelectorAll('#playlist-ul li');
            const loader = document.getElementById('loader');
            // --- ELEMEN BARU UNTUK PLAYER ICON ---
            const playerIconImg = document.getElementById('player-icon-img');

            let currentSongIndex = 0;
            let isPlaying = false;

            function loadSong(index) {
                const song = playlistItems[index];
                const songSrc = song.getAttribute('data-src');
                const coverSrc = song.getAttribute('data-cover');
                const title = song.querySelector('.song-title').textContent;
                const artist = song.querySelector('.artist-name').textContent;

                audioPlayer.src = songSrc;
                songTitleEl.textContent = title;
                artistEl.textContent = artist;

                if (coverImage.src !== coverSrc) {
                    coverImage.classList.add('loading');
                    coverImage.addEventListener('load', () => {
                        coverImage.classList.remove('loading');
                    }, { once: true });
                    coverImage.src = coverSrc;
                }
                
                // --- UPDATE GAMBAR DI PLAYER ICON JUGA ---
                if (playerIconImg.src !== coverSrc) {
                    playerIconImg.src = coverSrc; // Update langsung tanpa transisi untuk icon kecil
                }

                playlistItems.forEach(item => item.classList.remove('active'));
                song.classList.add('active');
            }

            function playSong() {
                isPlaying = true;
                const playPromise = audioPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        playPauseIcon.classList.remove('fa-play');
                        playPauseIcon.classList.add('fa-pause');
                    }).catch(error => {
                        console.log("Auto-play dicegah:", error);
                        isPlaying = false;
                    });
                }
            }

            function pauseSong() {
                isPlaying = false;
                audioPlayer.pause();
                playPauseIcon.classList.remove('fa-pause');
                playPauseIcon.classList.add('fa-play');
            }

            function nextSong() {
                currentSongIndex = (currentSongIndex + 1) % playlistItems.length;
                loadSong(currentSongIndex);
                playSong();
            }
            
            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
            }

            playPauseBtn.addEventListener('click', () => {
                if (isPlaying) {
                    pauseSong();
                } else {
                    playSong();
                }
            });

            playlistItems.forEach((item, index) => {
                item.addEventListener('click', () => {
                    if (currentSongIndex !== index) {
                        currentSongIndex = index;
                        loadSong(currentSongIndex);
                        pauseSong(); 
                    }
                });
            });

            audioPlayer.addEventListener('timeupdate', () => {
                const { duration, currentTime } = audioPlayer;
                if (duration) {
                    const progressPercent = (currentTime / duration) * 100;
                    progressBar.style.width = `${progressPercent}%`;
                    currentTimeEl.textContent = formatTime(currentTime);
                }
            });
            
            audioPlayer.addEventListener('loadedmetadata', () => {
                totalDurationEl.textContent = formatTime(audioPlayer.duration);
            });

            progressContainer.addEventListener('click', (e) => {
                const width = progressContainer.clientWidth;
                const clickX = e.offsetX;
                const duration = audioPlayer.duration;
                if (duration) {
                    audioPlayer.currentTime = (clickX / width) * duration;
                }
            });

            audioPlayer.addEventListener('ended', nextSong);

            audioPlayer.addEventListener('waiting', () => {
                loader.classList.add('visible');
            });

            audioPlayer.addEventListener('playing', () => {
                loader.classList.remove('visible');
            });
            
            audioPlayer.addEventListener('error', () => {
                alert("Gagal memuat lagu. Cek koneksi internet atau sumber lagu.");
                loader.classList.remove('visible');
                pauseSong();
            });

            loadSong(currentSongIndex);
        });
    </script>
</body>
</html>
